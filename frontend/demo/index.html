<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เดโม 005-tracking (ภาพรวม + แผนที่)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  body{font-family:system-ui,"Segoe UI","Noto Sans Thai",Tahoma,sans-serif;background:#eef2f4;color:#1e293b;margin:0;padding:16px;line-height:1.5}
  .wrap{max-width:520px;margin:0 auto}
  .card{background:#fff;border:1px solid #cbd5e1;border-radius:16px;padding:16px}
  .box{position:relative;height:440px;border-radius:12px;overflow:hidden;border:1px solid #cbd5e1}
  #map{position:absolute;inset:0}
  .overlay{position:absolute;left:10px;right:10px;background:rgba(255,255,255,.95);border-radius:10px;padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:14px;z-index:500}
  #status{top:10px;font-weight:700;color:#115e59}
  #team{bottom:10px}
  #log{font-size:12px;color:#475569;white-space:pre-wrap;max-height:160px;overflow:auto;background:#f8fafc;border-radius:8px;padding:8px;margin-top:10px}
  button{background:#fff;color:#0f766e;border:1px solid #0f766e;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;margin-top:10px}
  .legend{font-size:12px;color:#475569}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <div id="overview-view" class="card">
    <h3 style="margin:0 0 10px;font-size:15px;color:#475569">ภาพรวมการจอง (BookingOverviewPage)</h3>
    <div id="overview"></div>
    <div id="overview-log" style="font-size:12px;color:#475569;margin-top:8px">เดโมนี้ตั้งเวลานัดไว้ 15 วินาทีหลังเปิดหน้า ข้อมูลทั้งหมดเป็นข้อมูลจำลอง</div>
  </div>

  <div id="map-view" hidden>
    <div class="box">
      <div id="map"></div>
      <div id="status" class="overlay">หาคนขับ</div>
      <div id="team" class="overlay" style="display:none"></div>
    </div>
    <p class="legend">จุดแดง = คนขับ · จุดส้ม = จุดรับของ · จุดเขียว = ปลายทาง · เส้นฟ้า = คนขับไปจุดรับ · เส้นเขียวเข้ม = จุดรับไปปลายทาง (OSRM ฟรี ค่าตัวอย่าง ไม่ใช่ข้อมูลจริง)</p>
    <button id="back">กลับหน้าภาพรวม</button>
    <button id="reset">เริ่มใหม่</button>
    <div id="log"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="./main.jsx"></script>
</body>
</html>
